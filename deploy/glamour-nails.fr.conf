# Nginx — glamour-nails.fr (site statique)
# 1) Copier dans /etc/nginx/sites-available/, activer, puis lancer certbot :
#    certbot --nginx -d glamour-nails.fr -d www.glamour-nails.fr
#    (certbot ajoute les blocs HTTPS et la redirection http → https)
# 2) Après certbot, activer HTTP/2 : remplacer "listen 443 ssl;" par "listen 443 ssl; http2 on;"

# www → sans www (une seule version canonique)
server {
    listen 80;
    listen [::]:80;
    server_name www.glamour-nails.fr;
    return 301 https://glamour-nails.fr$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name glamour-nails.fr;

    root /var/www/glamour-nails.fr;
    index index.html;
    error_page 404 /404.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Dossiers techniques jamais servis
    location ~ ^/(deploy|image/originaux)/ { return 404; }
    location ~ /\.(git|gitignore) { return 404; }

    # Cache long pour les ressources versionnées ou immuables
    location ~* \.(css|js)$ { expires 30d; add_header Cache-Control "public, immutable"; }
    location ~* \.(woff2|jpg|jpeg|png|webp|mp4|svg|ico)$ { expires 365d; add_header Cache-Control "public, immutable"; }
    location ~* \.html$ { expires 10m; add_header Cache-Control "public, must-revalidate"; }

    # En-têtes de sécurité
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
