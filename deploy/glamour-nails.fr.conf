# Nginx — glamour-nails.fr (site statique)
# Certbot ajoutera lui-même le bloc HTTPS et la redirection.
server {
    listen 80;
    listen [::]:80;
    server_name glamour-nails.fr www.glamour-nails.fr;

    root /var/www/glamour-nails.fr;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cache long pour les ressources versionnées, court pour la page
    location ~* \.(css|js)$ { expires 7d; add_header Cache-Control "public"; }
    location ~* \.(jpg|jpeg|png|webp|mp4|svg|ico)$ { expires 30d; add_header Cache-Control "public"; }
    location = /index.html { expires 10m; }

    location / {
        try_files $uri $uri/ =404;
    }
}
